kind = "mobile"
previewPath = "/"
title = "inMyCity"
version = "1.0.0"
id = "artifacts/inmycity"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 25329

[services.development]
run = "pnpm --filter @workspace/inmycity run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/inmycity", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/inmycity", "run", "serve" ]

[services.env]
PORT = "25329"
BASE_PATH = "/"
