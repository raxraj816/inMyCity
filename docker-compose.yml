services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inmycity
      POSTGRES_USER: inmycity
      POSTGRES_PASSWORD: inmycity
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inmycity -d inmycity"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
