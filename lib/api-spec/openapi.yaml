openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: inMyCity API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: places
    description: Place operations
  - name: events
    description: Event operations
  - name: deals
    description: Deal operations
  - name: favorites
    description: Favorites operations
  - name: itineraries
    description: Itinerary operations
  - name: collections
    description: Collection operations
  - name: explore
    description: Explore/discovery operations
  - name: cities
    description: City operations
  - name: movies
    description: Movie operations
  - name: hotels
    description: Hotel operations
  - name: activities
    description: Activity operations
  - name: transit
    description: Transit operations
  - name: ai
    description: AI assistant operations
  - name: search
    description: Cross-catalogue search
  - name: pulse
    description: Pulse feed — editorial and reader-submitted posts
  - name: news
    description: Ingested, editorially reviewed local news
  - name: qa
    description: Local questions and answers
  - name: moderation
    description: Reporting and the published grievance path
  - name: cityGuide
    description: Editable City Guide header, facts and insider tips
  - name: admin
    description: >-
      Protected content operations, documented in docs/admin-api.md rather than here. The
      admin surface has no app client, so generating a React Query hook and a Zod schema per
      endpoint would be dead code; and its generic `/admin/{collection}` route carries both a
      path parameter and query filters, which orval renders as a value and a type under one
      name. Both reasons point the same way: the spec covers what the app consumes.
paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`).
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the returnTo path on success or /api/login on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /cities:
    get:
      operationId: getCities
      tags: [cities]
      summary: Get list of supported cities
      responses:
        "200":
          description: List of supported cities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportedCity"

  /places:
    get:
      operationId: getPlaces
      tags: [places]
      summary: Get nearby places
      parameters:
        - name: city
          in: query
          schema:
            type: string
        - name: lat
          in: query
          schema:
            type: number
        - name: lng
          in: query
          schema:
            type: number
        - name: radius
          in: query
          schema:
            type: number
        - name: category
          in: query
          schema:
            type: string
        - name: rating
          in: query
          schema:
            type: number
        - name: openNow
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of places
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Place"

  /places/{id}:
    get:
      operationId: getPlaceById
      tags: [places]
      summary: Get a place by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Place details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Place"
        "404":
          description: Not found

  /events:
    get:
      operationId: getEvents
      tags: [events]
      summary: Get events
      parameters:
        - name: city
          in: query
          schema:
            type: string
        - name: lat
          in: query
          schema:
            type: number
        - name: lng
          in: query
          schema:
            type: number
        - name: radius
          in: query
          schema:
            type: number
        - name: date
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"

  /events/{id}:
    get:
      operationId: getEventById
      tags: [events]
      summary: Get an event by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          description: Not found

  /deals:
    get:
      operationId: getDeals
      tags: [deals]
      summary: Get nearby deals
      parameters:
        - name: city
          in: query
          schema:
            type: string
        - name: lat
          in: query
          schema:
            type: number
        - name: lng
          in: query
          schema:
            type: number
        - name: radius
          in: query
          schema:
            type: number
        - name: category
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of deals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deal"

  /deals/{id}:
    get:
      operationId: getDealById
      tags: [deals]
      summary: Get a deal by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deal details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deal"
        "404":
          description: Not found

  /favorites:
    get:
      operationId: getFavorites
      tags: [favorites]
      summary: Get all favorites
      responses:
        "200":
          description: List of favorites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Favorite"
    post:
      operationId: addFavorite
      tags: [favorites]
      summary: Add a place to favorites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFavoriteInput"
      responses:
        "201":
          description: Favorite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Favorite"

  /favorites/{placeId}:
    delete:
      operationId: removeFavorite
      tags: [favorites]
      summary: Remove a place from favorites
      parameters:
        - name: placeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /itineraries:
    get:
      operationId: getItineraries
      tags: [itineraries]
      summary: Get itineraries
      parameters:
        - name: city
          in: query
          schema:
            type: string
        - name: duration
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of itineraries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Itinerary"

  /itineraries/{id}:
    get:
      operationId: getItineraryById
      tags: [itineraries]
      summary: Get an itinerary by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Itinerary details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Itinerary"
        "404":
          description: Not found

  /collections:
    get:
      operationId: getCollections
      tags: [collections]
      summary: Get all collections
      responses:
        "200":
          description: List of collections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Collection"
    post:
      operationId: createCollection
      tags: [collections]
      summary: Create a new collection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCollectionInput"
      responses:
        "201":
          description: Collection created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"

  /collections/{id}:
    get:
      operationId: getCollectionById
      tags: [collections]
      summary: Get collection by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
    delete:
      operationId: deleteCollection
      tags: [collections]
      summary: Delete a collection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /collections/{id}/places:
    post:
      operationId: addPlaceToCollection
      tags: [collections]
      summary: Add a place to a collection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPlaceToCollectionInput"
      responses:
        "200":
          description: Updated collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"

  /collections/{id}/places/{placeId}:
    delete:
      operationId: removePlaceFromCollection
      tags: [collections]
      summary: Remove a place from a collection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: placeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"

  /movies:
    get:
      operationId: getMovies
      tags: [movies]
      summary: Get movies
      parameters:
        - name: city
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [now_showing, coming_soon]
        - name: genre
          in: query
          schema:
            type: string
        - name: language
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of movies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Movie"

  /movies/{id}:
    get:
      operationId: getMovieById
      tags: [movies]
      summary: Get a movie by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Movie details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
        "404":
          description: Not found

  /hotels:
    get:
      operationId: getHotels
      tags: [hotels]
      summary: Get hotels
      parameters:
        - name: city
          in: query
          schema:
            type: string
        - name: lat
          in: query
          schema:
            type: number
        - name: lng
          in: query
          schema:
            type: number
        - name: radius
          in: query
          schema:
            type: number
        - name: category
          in: query
          schema:
            type: string
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of hotels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Hotel"

  /hotels/{id}:
    get:
      operationId: getHotelById
      tags: [hotels]
      summary: Get a hotel by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Hotel details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hotel"
        "404":
          description: Not found

  /activities:
    get:
      operationId: getActivities
      tags: [activities]
      summary: Get activities
      parameters:
        - name: city
          in: query
          schema:
            type: string
        - name: lat
          in: query
          schema:
            type: number
        - name: lng
          in: query
          schema:
            type: number
        - name: radius
          in: query
          schema:
            type: number
        - name: category
          in: query
          schema:
            type: string
        - name: openNow
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"

  /activities/{id}:
    get:
      operationId: getActivityById
      tags: [activities]
      summary: Get an activity by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Activity details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "404":
          description: Not found

  /transit/lines:
    get:
      operationId: getTransitLines
      tags: [transit]
      summary: Get transit lines for a city
      parameters:
        - name: city
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of transit lines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransitLine"

  /transit/lines/{id}:
    get:
      operationId: getTransitLineById
      tags: [transit]
      summary: Get a transit line by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Transit line details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitLine"
        "404":
          description: Not found

  /transit/search:
    get:
      operationId: searchTransitRoutes
      tags: [transit]
      summary: Search transit routes between stops
      parameters:
        - name: city
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of matching transit routes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransitRoute"

  /transit/routes/{id}:
    get:
      operationId: getTransitRouteById
      tags: [transit]
      summary: Get a transit route by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Transit route details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitRoute"
        "404":
          description: Not found

  /ai/chat:
    post:
      operationId: aiChat
      tags: [ai]
      summary: Chat with the city AI assistant (SSE streaming)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatRequest"
      responses:
        "200":
          description: SSE stream of AI response chunks
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Bad request
        "500":
          description: AI service error

  /search:
    get:
      operationId: search
      tags: [search]
      summary: Search everything in a city at once
      description: >-
        Matches the query against places, events, deals, hotels, activities and movies in one
        request. The query is expanded through the city's curated vocabulary first, so
        alternative spellings, abbreviations and Devanagari all reach the same rows. Results
        are ranked by a blend of text relevance, distance, rating and whether the venue is
        open now.
      parameters:
        - name: q
          in: query
          required: true
          description: What the user typed. An empty query returns no results rather than an error.
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: kind
          in: query
          description: Restrict results to a single kind. Counts always cover every kind.
          schema:
            type: string
            enum: [place, event, deal, hotel, activity, movie]
        - name: lat
          in: query
          schema:
            type: number
        - name: lng
          in: query
          schema:
            type: number
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Ranked results across every kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitySearchResponse"

  /explore/summary:
    get:
      operationId: getExploreSummary
      tags: [explore]
      summary: Get category summary counts for a location
      parameters:
        - name: city
          in: query
          schema:
            type: string
        - name: lat
          in: query
          schema:
            type: number
        - name: lng
          in: query
          schema:
            type: number
        - name: radius
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Category summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExploreSummary"

  /neighborhoods:
    get:
      operationId: listNeighborhoods
      tags: [recommendations]
      summary: List the launch neighbourhood zones for a city
      parameters:
        - name: city
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Neighbourhood zones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LaunchZone"

  /recommendations:
    get:
      operationId: getRecommendations
      tags: [recommendations]
      summary: Get ranked plan recommendations for a city
      parameters:
        - name: city
          in: query
          schema:
            type: string
        - name: mood
          in: query
          description: Free-text intent, e.g. `chill`, `date night`.
          schema:
            type: string
        - name: neighborhood
          in: query
          description: Launch zone id, e.g. `bandra`.
          schema:
            type: string
        - name: budget
          in: query
          description: Upper price bound, in the city's own currency.
          schema:
            type: number
        - name: weatherMode
          in: query
          schema:
            type: string
            enum: [rain-safe]
        - name: transitAccess
          in: query
          description: Any non-empty value boosts transit-friendly results.
          schema:
            type: string
      responses:
        "200":
          description: Ranked recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationsResponse"

  /pulse:
    get:
      operationId: getPulsePosts
      tags: [pulse]
      summary: List published Pulse posts for a city
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
        - name: city
          in: query
          schema:
            type: string
        - name: neighborhood
          in: query
          description: Launch zone id, e.g. `bandra`.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Published posts, featured first then newest
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PulsePost"
    post:
      operationId: submitPulsePost
      tags: [pulse]
      summary: Submit a Pulse post for moderation
      description: >-
        Answers 503 while submissions are closed. Nothing submitted here is ever published
        directly; it lands in the moderation queue as a pending row.
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitPulsePostInput"
      responses:
        "202":
          description: Accepted for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionAccepted"
        "400":
          description: Invalid submission
        "503":
          description: Submissions are not open yet

  /pulse/digest:
    get:
      operationId: getPulseDigest
      tags: [pulse]
      summary: The ranked Pulse front page for a city
      description: >-
        A mixed digest drawn from Pulse, events, places, deals, activities, movies and
        answered questions. Each section states what it holds and how it is ordered; a
        section with nothing in it is omitted rather than returned empty.
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
        - name: city
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The digest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PulseDigest"
        "400":
          description: city is required

  /pulse/{id}:
    get:
      operationId: getPulsePostById
      tags: [pulse]
      summary: Get one published Pulse post
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PulsePost"
        "404":
          description: Not found

  /pulse/{id}/reactions:
    post:
      operationId: togglePulseReaction
      tags: [pulse]
      summary: Toggle a like or a save on a post
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PulseReactionInput"
      responses:
        "200":
          description: The reaction's new state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PulseReactionState"
        "404":
          description: Not found

  /news:
    get:
      operationId: getNewsItems
      tags: [news]
      summary: List published news items for a city
      parameters:
        - name: city
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Published news, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsItem"

  /qa/questions:
    get:
      operationId: getQaQuestions
      tags: [qa]
      summary: List published questions for a city
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
        - name: city
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [recent, top]
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Published questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QaQuestion"
    post:
      operationId: submitQaQuestion
      tags: [qa]
      summary: Ask a question, for moderation
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitQaQuestionInput"
      responses:
        "202":
          description: Accepted for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionAccepted"
        "400":
          description: Invalid submission
        "503":
          description: Submissions are not open yet

  /qa/questions/{id}:
    get:
      operationId: getQaQuestionById
      tags: [qa]
      summary: Get one question with its published answers
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The question and its answers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QaQuestionDetail"
        "404":
          description: Not found

  /qa/questions/{id}/answers:
    post:
      operationId: submitQaAnswer
      tags: [qa]
      summary: Answer a question, for moderation
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitQaAnswerInput"
      responses:
        "202":
          description: Accepted for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionAccepted"
        "400":
          description: Invalid submission
        "404":
          description: Question not found
        "503":
          description: Submissions are not open yet

  /qa/{targetType}/{id}/upvote:
    post:
      operationId: toggleQaUpvote
      tags: [qa]
      summary: Toggle an upvote on a question or an answer
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
        - name: targetType
          in: path
          required: true
          schema:
            type: string
            enum: [questions, answers]
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The new vote state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QaUpvoteState"
        "404":
          description: Not found

  /reports:
    post:
      operationId: submitContentReport
      tags: [moderation]
      summary: Report a piece of content
      description: >-
        Open to signed-out readers. The response carries the window inside which the report
        will be answered, which is what the app shows back to the reporter.
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitContentReportInput"
      responses:
        "201":
          description: Report filed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentReportReceipt"
        "400":
          description: Invalid report

  /community-policy:
    get:
      operationId: getCommunityPolicy
      tags: [moderation]
      summary: The published grievance contact, report reasons and submission state
      responses:
        "200":
          description: Policy details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPolicy"

  /city-guide:
    get:
      operationId: getCityGuide
      tags: [cityGuide]
      summary: Editable City Guide header, facts and insider tips for a city
      parameters:
        - name: city
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: City guide content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CityGuideContent"
        "400":
          description: city is required

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
    DeviceIdHeader:
      name: X-Device-Id
      in: header
      required: false
      description: >-
        Stable per-install identifier. Lets likes, saves, joins and upvotes work before
        sign-in; the server namespaces it so it can never collide with a user id.
      schema:
        type: string
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    AiChatRequest:
      type: object
      properties:
        message:
          type: string
        city:
          type: string
        history:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                type: string
            required:
              - role
              - content
      required:
        - message
        - city

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SupportedCity:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        displayName:
          type: string
        country:
          type: string
        state:
          type: string
        lat:
          type: number
        lng:
          type: number
        status:
          type: string
          enum: ["live", "soon"]
        tagline:
          type: string
      required:
        - id
        - name
        - displayName
        - country
        - state
        - lat
        - lng
        - status
        - tagline

    Place:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        description:
          type: ["string", "null"]
        address:
          type: string
        city:
          type: string
        lat:
          type: number
        lng:
          type: number
        rating:
          type: ["number", "null"]
        reviewCount:
          type: ["integer", "null"]
        phone:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        openingHours:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        images:
          type: array
          items:
            type: string
        distanceKm:
          type: ["number", "null"]
        isOpen:
          type: ["boolean", "null"]
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
      required:
        - id
        - name
        - category
        - address
        - city
        - lat
        - lng
        - images
        - tags
        - createdAt

    Event:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        category:
          type: string
        venue:
          type: string
        address:
          type: string
        city:
          type: string
        lat:
          type: ["number", "null"]
        lng:
          type: ["number", "null"]
        startDate:
          type: string
        endDate:
          type: ["string", "null"]
        price:
          type: ["number", "null"]
        isFree:
          type: boolean
        imageUrl:
          type: ["string", "null"]
        bookingUrl:
          type: ["string", "null"]
        distanceKm:
          type: ["number", "null"]
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
      required:
        - id
        - title
        - category
        - venue
        - address
        - city
        - startDate
        - isFree
        - tags
        - createdAt

    Deal:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        placeId:
          type: ["integer", "null"]
        placeName:
          type: string
